[project]
name = "orange-project"
version = "0.1.0"
description = "Entorno aislado y suite de trabajo para Orange Data Mining en Ubuntu 24.04 LTS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "orange3>=3.41.0",
    "PyQt6>=6.8.0",
    "PyQt6-WebEngine>=6.8.0",
    "scikit-learn>=1.6.0",
    "xgboost>=3.0.0",
    "pandas>=2.2.0",
    "matplotlib>=3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
